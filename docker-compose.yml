version: "3.9"

services:
  backend:
    build:
      context: ./smacom-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - ALLOWED_ORIGINS=http://localhost:4173
    restart: unless-stopped

  frontend:
    build:
      context: ./green-cycle-hub
      dockerfile: Dockerfile
    ports:
      - "4173:80"
    depends_on:
      - backend
    restart: unless-stopped
